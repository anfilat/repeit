name: Deploy to GitHub Pages

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check if beta branch exists
        id: beta
        run: |
          if git ls-remote --heads ${{ github.server_url }}/${{ github.repository }}.git beta | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Build main
      - uses: actions/checkout@v6
        with:
          ref: main
          path: src-main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src-main/package-lock.json
      - run: npm ci && npm run build
        working-directory: src-main
      - run: mv src-main/dist dist-main

      # Build beta (only if branch exists)
      - uses: actions/checkout@v6
        if: steps.beta.outputs.exists == 'true'
        with:
          ref: beta
          path: src-beta
      - run: npm ci && npm run build
        if: steps.beta.outputs.exists == 'true'
        working-directory: src-beta
        env:
          VITE_BASE: /repeit/beta/
      - run: mv src-beta/dist dist-beta
        if: steps.beta.outputs.exists == 'true'

      # Combine
      - run: mkdir dist && mv dist-main/* dist/
      - run: mv dist-beta dist/beta
        if: steps.beta.outputs.exists == 'true'

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
