            <div style="background:#334155;border-radius:6px;padding:6px 10px;color:#94a3b8;font-size:12px;">🗑</div>
          </div>
        </div>
      </div>

  </div>

  <div class="mockup">
    <div class="mockup-header">Proposed: dropdown menu</div>
    <div class="mockup-body">
      <div style="display:flex;flex-direction:column;gap:8px;padding:8px;">
        <!-- New footer -->
        <div style="background:#1e293b;border-radius:8px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;">
